name: ci

on:
  push:
    # `embedded` is the v2 line until it merges into main; without it the
    # pre-tag pushes run no CI at all.
    branches: [main, embedded]
  pull_request:
    branches: [main, embedded]

permissions:
  contents: write
  deployments: write

defaults:
  run:
    working-directory: tzf

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # go.mod replaces github.com/ringsaturn/tzf-dist with ../tzf-dist, so
      # the two repos are checked out side by side. Once the replace is
      # dropped (tzf-dist ships the .tzb/.tzm release, W7) the module comes
      # from the proxy instead; this checkout stays because the pipeline
      # step below writes its artifacts there and because tzf-dist's own
      # embed + alignment tests run in the same job.
      - uses: actions/checkout@v7
        with:
          path: tzf

      - uses: actions/checkout@v7
        with:
          repository: ringsaturn/tzf-dist
          path: tzf-dist

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tzf/go.mod

      # The artifact set is built from the upstream raw GeoJSON — a
      # minutes-long pipeline — so cache both the gob intermediates (parity
      # fixtures) and the installed artifacts on the dataset + pipeline hash.
      #
      # tzf-dist/embed_v2.go is deliberately NOT cached: it is a shim the
      # bootstrap script writes only while the tzf-dist checkout predates the
      # v2 embeds. Restoring it next to a checkout that already declares
      # LiteTZB (once v2-artifacts merges into tzf-dist main) would duplicate
      # the declarations and break the build. The key is versioned (v2-) so
      # entries written by the old path cannot be restored either.
      - name: Cache pipeline outputs
        id: data-cache
        uses: actions/cache@v4
        with:
          path: |
            tzf/tmp/tzf-dist-dev
            tzf-dist/lite.tzb
            tzf-dist/lite.tzm
            tzf-dist/full.tzb
          key: tzf-data-v2-2026c-${{ hashFiles('tzf/cmd/**', 'tzf/internal/**', 'tzf/scripts/build-tzf-dist-dev.sh') }}

      # Runs on every job, cache hit or not: writes the shim while tzf-dist
      # still predates the v2 embeds, and removes it once the checkout
      # declares them itself. Seconds, not minutes.
      - name: Reconcile tzf-dist embed shim
        run: ./scripts/build-tzf-dist-dev.sh --shim-only

      - name: Build artifact set from GeoJSON
        if: steps.data-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tzf-dist-dev.sh

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
          skip-cache: true
          working-directory: tzf

      - name: Test
        run: |
          TZF_PARITY_TOPO="$PWD/tmp/tzf-dist-dev/combined-with-oceans.topology.compress.topo.gob" \
          TZF_PARITY_PREINDEX="$PWD/tmp/tzf-dist-dev/combined-with-oceans.topology.preindex.gob" \
            go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Test tzf-dist (embed + alignment)
        working-directory: tzf-dist
        run: go test ./...

      - name: Verify embedded binary format
        run: |
          go run ./internal/cmd/embedcompare -dense-step 1 -boundary-samples 10000 \
            -preindex tmp/tzf-dist-dev/combined-with-oceans.topology.preindex.gob \
            -tzm ../tzf-dist/lite.tzm \
            tmp/tzf-dist-dev/combined-with-oceans.topology.compress.topo.gob \
            ../tzf-dist/lite.tzb

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          working-directory: tzf

      - name: Bench
        run: make bench

      - name: Memory footprint
        run: make bench-memory

      - name: Write benchmark summary
        run: python3 scripts/bench2summary.py benchmark_result.txt memory_result.txt >> $GITHUB_STEP_SUMMARY
