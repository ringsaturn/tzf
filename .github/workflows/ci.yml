name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  deployments: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The committed go.work substitutes tmp/tzf-dist-dev for the
      # not-yet-published tzf-dist artifact release; nothing in the workspace
      # builds until the bootstrap has run. It builds everything from the
      # upstream raw GeoJSON, so cache it on the dataset + pipeline sources.
      - name: Cache tzf-dist dev stand-in
        id: dev-cache
        uses: actions/cache@v4
        with:
          path: tmp/tzf-dist-dev
          key: tzf-dist-dev-2026c-${{ hashFiles('cmd/**', 'internal/**', 'convert/**', 'scripts/build-tzf-dist-dev.sh') }}

      - name: Build tzf-dist dev stand-in
        if: steps.dev-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-tzf-dist-dev.sh

      # A `replace` directive only applies when its module is the main module,
      # so a dependency graph that resolves here can still be broken for
      # consumers (see #217). Build tzf from a throwaway module where tzf is a
      # dependency, which is the only way that difference shows up.
      # (Skipped until the tzf-dist artifact release exists: consumers cannot
      # resolve the embedded data before then.)

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m
          skip-cache: true

      - name: Test
        run: |
          TZF_PARITY_TOPO="$PWD/tmp/tzf-dist-dev/combined-with-oceans.topology.compress.topo.gob" \
          TZF_PARITY_PREINDEX="$PWD/tmp/tzf-dist-dev/combined-with-oceans.topology.preindex.gob" \
            go test -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Verify embedded binary format
        run: |
          go run ./internal/cmd/embedcompare -dense-step 1 -boundary-samples 10000 \
            -preindex tmp/tzf-dist-dev/combined-with-oceans.topology.preindex.gob \
            -tzm tmp/tzf-dist-dev/lite.tzm \
            tmp/tzf-dist-dev/combined-with-oceans.topology.compress.topo.gob \
            tmp/tzf-dist-dev/lite.tzb

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7

      - name: Bench
        run: make bench

      - name: Memory footprint
        run: make bench-memory

      - name: Write benchmark summary
        run: python3 scripts/bench2summary.py benchmark_result.txt memory_result.txt >> $GITHUB_STEP_SUMMARY
